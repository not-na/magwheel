#
# This file contains selected Kconfig options for the application.
# See https://docs.zephyrproject.org/latest/kconfig.html for all possible options.

# Shell & Logging
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_I2C_SHELL=y

# USB
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_MAGWHEEL_CDC=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_VID=0x1209
# Change PID once we have one from pid.codes
CONFIG_USB_PID=0x0001
CONFIG_USB_MANUFACTURER="not-na"
CONFIG_USB_PRODUCT="MagWheel"

# Button Input
CONFIG_GPIO=y
CONFIG_INPUT=y

# Sensor
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y

# Misc
CONFIG_RESET=y
CONFIG_BUILD_OUTPUT_UF2=y

# LED
CONFIG_LED_STRIP=y
CONFIG_PIO_RPI_PICO=y